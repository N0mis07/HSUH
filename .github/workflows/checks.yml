name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hsuh tests
      - run: node --check hsuh/static/app.js && node --check hsuh/static/sw.js
      - run: python scripts/audit.py
