name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Audit the publishable head, excluding GitHub's temporary merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --no-fund
      - run: npm run build:ui
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hsuh tests
      - run: node --check hsuh/static/app.js && node --check hsuh/static/sw.js
      - run: node tests/frontend_races.cjs
      - run: node tests/openui.mjs
      - run: python scripts/audit.py
